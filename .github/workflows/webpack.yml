# NOTE: This file previously contained the GitHub template "NodeJS with Webpack"
# (npm install && npx webpack). The project does not use Webpack; it is built
# with Vite (client) + esbuild (server) and managed with pnpm (see package.json).
# Replaced with a pnpm-based CI. Consider renaming this file to ci.yml.
name: CI (pnpm)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      # pnpm version is taken from "packageManager" in package.json (pnpm@10.4.1)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Build (vite + esbuild)
        run: pnpm run build

      - name: Test (vitest)
        run: pnpm run test
