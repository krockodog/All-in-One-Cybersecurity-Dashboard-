version: "3.9"

services:
  # ─────────────────────────────────────────────────
  # CyberDash Application
  # ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cyberdash
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database (optional — only needed for Engagement/Workflow features)
      DATABASE_URL: ${DATABASE_URL:-}
      # Auth (optional — only needed for protected tRPC procedures)
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      # OAuth (optional)
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      # KI: eigener Ollama-Server (einziges LLM-Backend, kein Bezahldienst)
      # WICHTIG (Linux): Ollama bindet standardmäßig nur an 127.0.0.1 und ist dann
      # aus dem Container über host.docker.internal NICHT erreichbar. Auf dem Host:
      #   sudo systemctl edit ollama  ->  [Service]
      #                                    Environment="OLLAMA_HOST=0.0.0.0:11434"
      #   sudo systemctl restart ollama
      # und Port 11434 per Firewall nur für das Docker-Netz freigeben, z. B.:
      #   sudo ufw allow from 172.16.0.0/12 to any port 11434 proto tcp
      #   sudo ufw deny 11434/tcp
      # Alternativ Ollama selbst als Container im selben Compose-Netz betreiben und
      # OLLAMA_URL=http://ollama:11434 setzen.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-4096}
      # Nur bei eigenem Ollama unter öffentlichem Hostnamen (dann HTTPS + Key):
      OLLAMA_ALLOWED_HOSTS: ${OLLAMA_ALLOWED_HOSTS:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # Vertrauenswürdige Reverse-Proxys für X-Forwarded-For (Rate-Limits pro IP).
      # Standard: loopback + private Netze (z. B. nginx im Docker-Netz).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Legacy Manus-Forge-Dienste (optional, NICHT für KI)
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount a local .env for secrets — never commit .env to git
      - ./.env.docker:/app/.env:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cyberdash-net

  # ─────────────────────────────────────────────────
  # MySQL (optional — enables Engagement Dashboard)
  # ─────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: cyberdash-db
    restart: unless-stopped
    profiles:
      - with-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cyberdash}
      MYSQL_USER: ${MYSQL_USER:-cyberdash}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cyberdash}
    volumes:
      - cyberdash-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberdash-net

volumes:
  cyberdash-db-data:

networks:
  cyberdash-net:
    driver: bridge
