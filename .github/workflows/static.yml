# Manual, static-only preview of the Vite frontend on GitHub Pages.
#
# IMPORTANT: This app is server-backed (tRPC under /api/*, Express backend in
# dist/index.js). GitHub Pages can only host static files, so a Pages deployment
# is a UI preview only - API-backed features (tools, AI chat, reports, auth) do
# not work there. The real deployment is the Node server / Docker image
# (see README, docker-compose.yml). Therefore this workflow no longer runs on
# every push; it has to be triggered manually.
name: Deploy static UI preview to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # pnpm version is taken from "packageManager" in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build frontend with the Pages base path
        # base_path is "/<repo>" for project pages and "" for a custom domain.
        # Vite prefixes assets with it; the router uses import.meta.env.BASE_URL.
        run: pnpm exec vite build --base "${{ steps.pages.outputs.base_path }}/"
      - name: SPA fallback for client-side routes
        # Pages serves 404.html for unknown paths, so deep links/refreshes load the app.
        run: cp dist/public/index.html dist/public/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish ONLY the built frontend - never the repository itself
          # (sources, scripts, docs or credentials must not end up on Pages).
          path: 'dist/public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Note about backend
        run: |
          echo "### Static UI preview only" >> "$GITHUB_STEP_SUMMARY"
          echo "API-backed features need the Node/Docker deployment; GitHub Pages cannot run /api/*." >> "$GITHUB_STEP_SUMMARY"
