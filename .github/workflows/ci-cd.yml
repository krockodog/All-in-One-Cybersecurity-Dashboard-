name: CI/CD Pipeline

# Streamlined pipeline (replaces the previous template, which could not run):
#  - quality:  install -> format check (non-blocking) -> type check -> build -> test
#  - security: Trivy filesystem scan (SARIF upload) + pnpm audit (non-blocking)
#  - docker:   build image; push to GHCR only on push events (not on PRs)
# Removed jobs (were placeholders / broken): performance, deploy, release, notify.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # QUALITY: install, format, type check, build, test
  # ============================================================================
  quality:
    name: Quality (check, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json (pnpm@10.4.1).
      # Must run BEFORE setup-node so that `cache: pnpm` can find pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Non-blocking for now: ~240 files are not yet prettier-formatted.
      - name: Check formatting
        run: pnpm exec prettier --check .
        continue-on-error: true

      - name: TypeScript type check
        run: pnpm run check

      - name: Build (vite + esbuild)
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        # pinned to v0.36.0 by commit SHA
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Dependency audit (non-blocking)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  # ============================================================================
  # DOCKER BUILD
  # ============================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [quality, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
