<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none" role="img" aria-label="Cyber Earth">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="0.5" stop-color="#075985"/>
      <stop offset="1" stop-color="#020a12"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="eglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#eglow)">
    <circle cx="300" cy="300" r="150" fill="url(#core)" stroke="url(#ring)" stroke-width="2.5"/>
    <g stroke="url(#ring)" stroke-width="1.4" fill="none" opacity="0.55">
      <ellipse cx="300" cy="300" rx="150" ry="52"/>
      <ellipse cx="300" cy="300" rx="120" ry="150"/>
      <ellipse cx="300" cy="300" rx="60" ry="150"/>
      <line x1="150" y1="300" x2="450" y2="300"/>
    </g>
    <g stroke="url(#ring)" stroke-width="2" opacity="0.85">
      <ellipse cx="300" cy="300" rx="205" ry="205" fill="none" stroke-dasharray="6 12"/>
      <ellipse cx="300" cy="300" rx="240" ry="240" fill="none" opacity="0.4" stroke-dasharray="2 16"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="300" cy="95" r="4"/>
      <circle cx="505" cy="300" r="4"/>
      <circle cx="300" cy="505" r="4"/>
      <circle cx="95" cy="300" r="4"/>
    </g>
  </g>
</svg>
